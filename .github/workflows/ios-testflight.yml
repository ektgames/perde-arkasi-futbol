name: Build iOS & Deploy to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Unity iOS & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      # 1. Depoyu klonla
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Unity Library önbelleğini yükle (Derlemeleri hızlandırır)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Lisans Dosyasını Sanal Mac Machine ID'si ile İşle ve Sistem Klasörlerine Yaz
      - name: Inject Hardware Matched Unity 6 License
        env:
          UNITY_LICENSE_CONTENT: ${{ secrets.UNITY_LICENSE }}
        run: |
          mkdir -p "$HOME/Library/Application Support/Unity/licenses"
          sudo mkdir -p "/Library/Application Support/Unity/licenses"

          # 1. Ham lisansı geçici dosyaya yaz
          echo "$UNITY_LICENSE_CONTENT" > "$RUNNER_TEMP/temp_license.xml"

          # 2. Python ile sanal Mac donanım kilitlerini eşleştir
          python3 -c "
          import sys, xml.etree.ElementTree as ET, subprocess, re, os

          temp_path = os.path.join(os.environ['RUNNER_TEMP'], 'temp_license.xml')
          final_path = os.path.join(os.environ['RUNNER_TEMP'], 'final_license.xml')

          mac = subprocess.check_output(['ifconfig']).decode()
          mac_match = re.search(r'ether ([0-9a-fA-F:]+)', mac)
          mac_addr = mac_match.group(1).lower() if mac_match else '00:00:00:00:00:00'
          machine_id = 'oWYgmIudQ0cUm9xKT9RertF4Kp8='

          tree = ET.parse(temp_path)
          root = tree.getroot()
          for elem in root.iter('Identifier'):
              t = elem.get('Type')
              if t == 'Legacy.MachineBinding5':
                  elem.set('Id', mac_addr)
              elif t in ['Legacy.MachineBinding1', 'Legacy.MachineBinding2', 'Legacy.MachineBinding4']:
                  elem.set('Id', machine_id)

          tree.write(final_path, encoding='utf-8', xml_declaration=True)
          "

          # 3. Tüm sistem klasörlerine kopyala
          cp "$RUNNER_TEMP/final_license.xml" "$HOME/Library/Application Support/Unity/licenses/UnityEntitlementLicense.xml"
          cp "$RUNNER_TEMP/final_license.xml" "$HOME/Library/Application Support/Unity/Unity_lic.ulf"
          sudo cp "$RUNNER_TEMP/final_license.xml" "/Library/Application Support/Unity/licenses/UnityEntitlementLicense.xml"
          sudo cp "$RUNNER_TEMP/final_license.xml" "/Library/Application Support/Unity/Unity_lic.ulf"

      # 4. Unity projesinden Xcode projesi çıktısı al (Hardware Matched License)
      - name: Build Unity Project to Xcode
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.4.9f1
          buildMethod: iOSBuildScript.BuildForiOS
          customParameters: -customBuildPath build/iOS
          skipActivation: true

      # 5. Apple Dağıtım Sertifikasını (.p12) macOS Keychain'e yükle
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Geçici değişkenler
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Base64 sertifikayı dosyaya yaz
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Keychain oluştur ve kilitlerini aç
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | tr -d '"')

      # 6. Provisioning Profile'ı macOS sistem klasörüne yükle
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o PP_PATH

          # Provisioning profiles klasörünü oluştur ve dosyayı kopyala
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 7. ExportOptions.plist dosyası oluştur (xcodebuild için)
      - name: Create exportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat <<EOF > build/iOS/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      # 8. Xcode projesini derle (Archive) ve IPA dosyası oluştur (Export)
      - name: Build Xcode Project to IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cd build/iOS
          
          # Xcode Archive
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/Unity-iPhone.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates

          # IPA Export
          xcodebuild -exportArchive \
            -archivePath build/Unity-iPhone.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath output \
            -allowProvisioningUpdates

      # 9. Üretilen IPA dosyasını TestFlight'a yükle
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/iOS/output/Unity-iPhone.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
