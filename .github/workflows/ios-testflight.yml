          # Docker İçinde Unity Editor Çalıştır
          docker run --rm \
            -v "$(pwd):/project" \
            -v "$RUNNER_TEMP/unity_license/Unity_lic.ulf:/root/.local/share/unity3d/Unity/Unity_lic.ulf" \
            -v "$RUNNER_TEMP/unity_license/Unity_lic.ulf:/root/.config/unity3d/Unity/Unity_lic.ulf" \
            -w /project \
            unityci/editor:ubuntu-6000.4.9f1-ios-3 \
            unity-editor -batchmode -nographics -projectPath /project -executeMethod iOSBuildScript.BuildForiOS -customBuildPath build/iOS -quit

      # 4. Üretilen Xcode projesini macOS işine aktarmak için yükle
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: build/iOS
          retention-days: 1

  deploy-testflight:
    name: Build Xcode & Upload to TestFlight
    needs: build-unity
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # 1. Depoyu klonla
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Linux işinde üretilen Xcode projesini indir
      - name: Download Xcode Project Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-xcode-build
          path: build/iOS

      # 3. Apple Dağıtım Sertifikasını (.p12) macOS Keychain'e aktar
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Base64 sertifikayı p12 olarak yaz
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          # Keychain oluştur ve kilitlerini aç
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sertifikayı keychain içine aktar ve erişim izinlerini ver
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')

      # 4. Provisioning Profile'ı macOS sistem klasörüne yükle
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # 5. ExportOptions.plist dosyası oluştur (xcodebuild için)
      - name: Create exportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat <<EOF > build/iOS/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      # 6. Xcode projesini derle (Archive) ve IPA dosyası oluştur (Export)
      - name: Build Xcode Project to IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cd build/iOS
          
          # Xcode Archive
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/Unity-iPhone.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates

          # IPA Export
          xcodebuild -exportArchive \
            -archivePath build/Unity-iPhone.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath output \
            -allowProvisioningUpdates

      # 7. Üretilen IPA dosyasını TestFlight'a yükle
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/iOS/output/Unity-iPhone.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
