                    <Entitlement Id="org.mixedrealitytoolkit.uxcomponents" />
                    <Entitlement Id="org.mixedrealitytoolkit.uxcomponents.noncanvas" />
                    <Entitlement Id="org.mixedrealitytoolkit.uxcore" />
