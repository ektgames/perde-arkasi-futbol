name: Build iOS & Deploy to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-unity:
    name: Build Unity iOS (to Xcode)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Depoyu klonla
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Unity Library önbelleğini yükle (Derlemeleri hızlandırır)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Docker içinde Unity 6 Editor çalıştırıp Xcode projesini üret (Lisans Dosyası Doğrudan Enjekte Edildi)
      - name: Build Unity Project to Xcode via Docker
        run: |
          mkdir -p build/iOS
          mkdir -p "$RUNNER_TEMP/unity_license"

          # Generic Game-CI Unity Lisansını Yaz
          cat << 'EOF' > "$RUNNER_TEMP/unity_license/Unity_lic.ulf"
