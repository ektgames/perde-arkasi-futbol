name: Build iOS & Deploy to TestFlight via Unity DevOps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  unity-devops-testflight:
    name: Build via Unity DevOps & Deploy to TestFlight
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Unity DevOps Build & Download IPA
        env:
          UNITY_DEVOPS_API_KEY: ${{ secrets.UNITY_DEVOPS_API_KEY }}
          UNITY_ORG_ID: ${{ secrets.UNITY_ORG_ID }}
          UNITY_PROJECT_ID: ${{ secrets.UNITY_PROJECT_ID }}
          UNITY_BUILD_TARGET_ID: ${{ secrets.UNITY_BUILD_TARGET_ID }}
        run: python3 scripts/unity_devops_download.py

      - name: Verify IPA
        run: |
          pwd
          ls -lah
          file Unity-iPhone.ipa

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: Unity-iPhone.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
